<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算機</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .main-title {
            color: rgb(255, 255, 255);
        }

        form {
            position: relative;
            width: 40%;
            background-color: rgb(156, 233, 226);
            margin: 24px auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 10px 10px 5px rgb(75, 83, 85, 0.8);
        }

        input {
            margin: 6px 0px;
            font-size: 20px;
            text-align: center;
            border-radius: 6px;
        }

        label {
            font-size: 20px;
            text-shadow: 1px 1px 2px;
        }

        select {
            font-size: 16px;
        }

        /* label文字大小 */
        /* 性別/居住縣市 使用div */
        .panel1 {
            background-color: rgb(195, 227, 255);
            padding: 6px;
            border: 2px dotted pink;
            margin: 6px;

        }

        button {
            margin-top: 1rem;
            width: 120px;
            height: 35px;
            background-color: rgb(124, 179, 124);
            border: none;
            font-size: 16px;
            border-radius: 6px;
            color: white;
        }

        button:hover {
            background-color: cadetblue;
            cursor: pointer;
        }

        a {
            /* 絕對位置(相對於relative) */
            position: absolute;
            background-color: brown;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            right: 12px;
            top: 12px;
        }


        .home-link {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background-color: brown;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            color: yellow;
        }

        #result {
            font-size: 2rem;
            font-weight: bold;
            background-color: rgb(197, 245, 213);
            width: 600px;
            margin: 24px auto;
            padding: 12px 24px;
            border: 1px dotted darkblue;
        }

        #info {
            background-color: rgb(247, 191, 123);
        }

        #record {
            font-size: 32px;
            margin-top: 24px;
        }

        .comment {
            font-size: 1.5rem;
            font-weight: 200;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        .bmi {
            font-size: 2.5rem;
        }


        table {
            background-color: rgb(220, 255, 243);
            margin: 0 auto;
            width: 600px;
            font-family: 'Courier New', Courier, monospace;
            border-collapse: collapse;
        }

        th {

            background-color: aqua;
        }

        @media screen and (max-width:1024px) {
            form {
                width: 60%;
            }

        }

        @media screen and (max-width:600px) {
            .main-title {
                color: yellow;
            }

            form {
                width: 80%;
            }

            #record {
                font-size: 24px;
            }

            #result {
                font-size: 1rem;
                width: 400px;
                margin: 12px auto;
                padding: 6px 12px;
                border: 1px dotted darkblue;

            }

            table {
                width: 450px;
            }
        }
    </style>

</head>

<body>
    <div class="main-title">BMI計算機</div>
    <div id="record">

    </div>

    <form action="">
        <label for="username">姓名</label>
        <input id="username" name="username" type="text" placeholder="請輸入姓名"><br>
        <label for="age">年齡</label>
        <input id="age" name="age" type="number" placeholder="18"><br>
        <label for="height">身高</label>
        <input id="height" name="height" type="number" step="0.1" value="178.5"><br>
        <label for="weight">體重</label>
        <input id="weight" name="weight" type="number" step="0.1"><br>

        <div class="panel1">
            <input type="radio" name="sex" id="male" checked value="男生">男
            <input type="radio" name="sex" id="female" value="女生">女

            <label for="county">居住縣市</label>
            <select name="county" id="county">
                <option value="台北市">台北市</option>
                <option value="新北市">新北市</option>
                <option value="桃園市">桃園市</option>
                <option value="台中市">台中市</option>
                <option value="台南市">台南市</option>
                <option value="高雄市">高雄市</option>
            </select>
        </div>

        <button type="button" onclick="calc()">計算</button>
        <button type="button" style="background-color:orange;color:black" id="deleteRecordBtn">刪除紀錄</button>

        <a href="index.html">首頁</a>
    </form>
    <!-- 新增 id=>info -->
    <!-- 將使用者的名字跟年齡/性別/縣市一行輸出(h2標籤可) -->
    <div id="info">


    </div>
    <div id="result" hidden="true">
        BMI:<span class="bmi">
        </span>
        <p class="comment">
        </p>
    </div>

    <div id="tableRecord">

    </div>

    <script>
        const nameEl = document.querySelector("#username");
        const ageEl = document.querySelector("#age");
        const heightEl = document.querySelector("#height");
        const weightEl = document.querySelector("#weight");
        const countyEl = document.querySelector("#county");
        const deleteRecordBtnEl = document.querySelector("#deleteRecordBtn");

        deleteRecordBtnEl.addEventListener("click", function () {
            localStorage.removeItem("record");
            localStorage.removeItem("datas");
            //刷新頁面
            //window.location.href = "";
            //清除資料
            data.total = 0;
            data.count = 0;
            datas = [];
            document.querySelector("#record").innerHTML = "";
            document.querySelector("#tableRecord").innerHTML = "";
        });

        //物件
        let data = {
            total: 0,
            count: 0
        }

        //陣列
        let datas = JSON.parse(localStorage.getItem("datas")) || [];
        //將字串轉成物件
        record = JSON.parse(localStorage.getItem("record"));
        if (record) {
            data = record;
            //加入顯示紀錄動作
            let avg = (data.total / data.count).toFixed(1);
            document.querySelector("#record").innerHTML = `紀錄人數:${data.count} 平均BMI:${avg}`;
        }


        if (datas.length > 0) {
            renderTable(datas);
        }


        function addRow(data) {
            return `
            <tr>   
                <td>${data.name}</td>
                <td>${data.county}</td>
                <td>${data.age}</td>
                <td>${data.sex}</td>
                <td>${data.height}</td>
                <td>${data.weight}</td>
                <td>${data.bmi}</td>
            </tr>
            `;
        }

        function renderTable(datas) {
            tableData = "";
            for (let i = 0; i < datas.length; i++) {
                console.log(i + 1, datas[i]);
                tableData += addRow(datas[i]);
            }

            let tableHtml = `
              <table border="1px" >
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>縣市</th>
                        <th>年齡</th>
                        <th>性別</th>
                        <th>身高</th>
                        <th>體重</th>
                        <th>BMI</th>
                    </tr>
                </thead>
                <tbody>
                ${tableData}
                </tbody>           

            </table>
            `

            console.log(tableHtml);

            document.querySelector("#tableRecord").innerHTML = tableHtml;

        }





        function calc() {
            // 取得最新的選取           
            const sexEl = document.querySelector("input[name='sex']:checked");
            let height = heightEl.value;
            let weight = weightEl.value;
            let name = nameEl.value;
            let age = ageEl.value;
            let sex = sexEl.value;
            let county = countyEl.value;
            // 判斷height 跟 weight 要大於0跟是數值not isNan
            // and ==> &&   or ==> ||
            if (height <= 0 || weight <= 0) {
                alert("請輸入正確數值!");
                return;
            }
            // 取消隱藏
            document.querySelector("#result").hidden = false;
            let userInfo = `${nameEl.value} 年齡:${ageEl.value} 姓別:${sexEl.value} 縣市:${countyEl.value}`;
            console.log(userInfo);
            document.querySelector("#info").innerHTML = `<h2>${userInfo}</h2>`;

            let bmi = getBmi(height, weight);
            let result = getComment(bmi);

            console.log(bmi, result[0], result[1]);

            const bmiEl = document.querySelector(".bmi");
            bmiEl.innerText = bmi;
            bmiEl.style.color = result[1];
            document.querySelector(".comment").innerText = result[0];

            //紀錄每次的bmi
            data.total += Number(bmi);
            data.count += 1;

            console.log(data);
            let avg = (data.total / data.count).toFixed(1);
            document.querySelector("#record").innerHTML = `紀錄人數:${data.count} 平均BMI:${avg}`;
            //本地網頁儲存(物件轉換成字串)
            localStorage.setItem("record", JSON.stringify(data));
            //儲存單筆資料
            let person = {
                name: name,
                age: age,
                sex: sex,
                county: county,
                height: height,
                weight: weight,
                bmi: bmi
            }

            datas.push(person);
            //儲存datas
            localStorage.setItem("datas", JSON.stringify(datas));

            renderTable(datas);
        }

        function getComment(bmi) {
            let comment, color;
            if (bmi < 18.5) {
                comment = "「體重過輕」，需要多運動，均衡飲食，以增加體能，維持健康！";
                color = "#1e90ff";

            } else if (bmi < 24) {
                comment = "恭喜！「健康體重」，要繼續保持！";
                color = "green";
            } else if (bmi < 27) {
                comment = "「體重過重」了，要小心囉，趕快力行「健康體重管理」！";
                color = "orange";
            } else {
                comment = "啊～「肥胖」，需要立刻力行「健康體重管理」囉！";
                color = "red";
            }

            return [comment, color];
        }


        // 函式宣告
        function getBmi(height, weight) {
            const bmi = weight / (height / 100) ** 2;
            return bmi.toFixed(2);
        }



    </script>
</body>

</html>
