<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算機</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .main-title {
            color: rgb(255, 255, 255);
        }

        form {
            width: 40%;
            background-color: rgb(156, 233, 226);
            margin: 24px auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 10px 10px 5px rgb(75, 83, 85, 0.8);
        }

        input {
            margin: 6px 0px;
            font-size: 20px;
            text-align: center;
            border-radius: 6px;
        }

        label {
            font-size: 20px;
            text-shadow: 1px 1px 2px;
        }

        select {
            font-size: 16px;
        }

        /* label文字大小 */
        /* 性別/居住縣市 使用div */
        .panel1 {
            background-color: rgb(195, 227, 255);
            padding: 6px;
            border: 2px dotted pink;
            margin: 6px;

        }

        button {
            margin-top: 1rem;
            width: 120px;
            height: 35px;
            background-color: rgb(124, 179, 124);
            border: none;
            font-size: 16px;
            border-radius: 6px;
            color: white;
        }

        button:hover {
            background-color: cadetblue;
            cursor: pointer;
        }

        a {
            background-color: brown;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;

        }


        .home-link {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background-color: brown;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            color: yellow;
        }

        @media screen and (max-width:1024px) {
            form {
                width: 60%;
            }

        }

        @media screen and (max-width:600px) {
            form {
                width: 80%;
            }

            .main-title {
                background-color: transparent;
                color: black;
            }

        }
    </style>



</head>

<body>
    <div class="main-title">BMI計算機</div>
    <form action="">
        <label for="username">姓名</label>
        <input id="username" name="username" type="text" placeholder="請輸入姓名"><br>
        <label for="age">年齡</label>
        <input id="age" name="age" type="number" placeholder="18"><br>
        <label for="height">身高</label>
        <input id="height" name="height" type="number" step="0.1"><br>
        <label for="weight">體重</label>
        <input id="weight" name="weight" type="number" step="0.1"><br>

        <div class="panel1">
            <input type="radio" name="sex" id="male" checked>男
            <input type="radio" name="sex" id="female"> 女

            <label for="county">居住縣市</label>
            <select name="county" id="county">
                <option value="台北市">台北市</option>
                <option value="新北市">新北市</option>
                <option value="桃園市">桃園市</option>
                <option value="台中市">台中市</option>
                <option value="台南市">台南市</option>
                <option value="高雄市">高雄市</option>
            </select>
        </div>

        <button type="submit">計算</button>

    </form>
    <a href="index.html">首頁</a>


</body>

</html>
