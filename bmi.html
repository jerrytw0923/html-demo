<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算機</title>
    <style>
        .title{
            color:blueviolet;     
            font-family: 'Times New Roman', Times, serif;
            background-color: rgb(255, 219, 194);
            /* 1rem=>16px */
            font-size: 2rem; 
            display: inline-block;
            width: 600px;
            margin: 10px 20px;
            padding: 6px;
            border: 1px solid rgb(214, 131, 131);
            border-radius: 6px;
        }
    
        /* . => class */
        .main-title{
            background-color: cadetblue;
            font-size: 2.5rem;
            color:white;
            border: none;
            margin-left: 0px;
            width: 800px;       
        }
    
        #picture{
            text-align:center;
        }
    
        /* # => id */
        #table-bmi{
            background-color:aqua;
            width: 50%;
            height: 300px;
            margin: 6px auto;
        }
        
        thead{
            background-color:aquamarine;
        }
    
        tbody{
            background-color: tomato;
        }
    
        tr{
            color:white;
        }
    
        thead tr{
            color:black;    
        }
        
        /*thead tbody tr td */
    
        body{
            text-align: center;
            background-color: rgb(246, 255, 215);
            font-family:"標楷體", 'Arial Narrow Bold', sans-serif;
        }
    
        .image-style{
           background-color: rgb(255, 255, 255); 
           padding: 12px;
           border: 1px solid;
           border-radius: 6px;
           width: 30%;
        }
    
                
        </style>
</head>
<body>
    <h1>BMI計算機</h1>
    <form action="">
        <label for="username">姓名</label>
        <input id="username" name="username" type="text" placeholder="請輸入姓名"><br>
        <label for="age">年齡</label>
        <input id="age" name="age" type="number" placeholder="18"><br>
        <label for="height">身高</label>
        <input id="height" name="height" type="number" step="0.1"><br>
        <label for="weight">體重</label>
        <input id="weight" name="weight" type="number" step="0.1"><br>


        <input type="radio" name="sex" id="male" checked>男
        <input type="radio" name="sex" id="female"> 女
        
        <label for="county">居住縣市</label>
        <select name="county" id="county">
            <option value="台北市">台北市</option>
            <option value="新北市">新北市</option>
            <option value="桃園市">桃園市</option>
            <option value="台中市">台中市</option>
            <option value="台南市">台南市</option>
            <option value="高雄市">高雄市</option>
        </select>
        <br>
        <button type="submit">計算</button>      
        
    </form>
    <a href="index.html">首頁</a>


</body>
</html>
